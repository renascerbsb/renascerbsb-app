<section class="app-page app-page-narrow pessoa-form-page">
  <header class="page-header">
    <div>
      <h1 class="page-title">{{ tituloPagina }}</h1>
      <p class="page-subtitle">{{ subtituloPagina }}</p>
    </div>

    <p-button label="Voltar" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" routerLink="/pessoas" />
  </header>

  <p-card>
    <form [formGroup]="form" (ngSubmit)="salvar()" class="form-grid">
      <div class="field col-span-6">
        <label for="ds_nome">Nome</label>
        <input id="ds_nome" pInputText [invalid]="campoInvalido('ds_nome')" formControlName="ds_nome" />

        @if (campoInvalido('ds_nome')) {
          <p-message severity="error" size="small" variant="simple" text="Nome e obrigatorio." />
        }
      </div>

      <div class="field col-span-3">
        <label for="nr_telefone">Telefone</label>
        <input id="nr_telefone" pInputText appTelefoneMask type="tel" formControlName="nr_telefone" />
      </div>

      <div class="field col-span-3">
        <label for="dt_nascimento">Data de nascimento</label>
        <input id="dt_nascimento" pInputText type="date" formControlName="dt_nascimento" />
      </div>

      <div class="field col-span-3">
        <label>Genero</label>
        <div class="radio-row">
          <label>
            <p-radiobutton name="tp_genero" value="F" formControlName="tp_genero" inputId="generoPessoaF" />
            <span>Feminino</span>
          </label>

          <label>
            <p-radiobutton name="tp_genero" value="M" formControlName="tp_genero" inputId="generoPessoaM" />
            <span>Masculino</span>
          </label>
        </div>
      </div>

      <div class="field col-span-3">
        <label for="seq_filial">Congregação</label>
        <p-select
          inputId="seq_filial"
          [options]="filiais"
          optionLabel="ds_nome"
          optionValue="seq_filial"
          placeholder="Selecione"
          [invalid]="campoInvalido('seq_filial')"
          formControlName="seq_filial"
        />

        @if (campoInvalido('seq_filial')) {
          <p-message severity="error" size="small" variant="simple" text="Congregação e obrigatoria." />
        }
      </div>

      <div class="field col-span-6">
        <label for="seq_cidade">Bairro de residência</label>
        <p-select
          inputId="seq_cidade"
          [options]="residencias"
          optionLabel="ds_nome"
          optionValue="seq_cidade"
          placeholder="Selecione"
          [filter]="true"
          [invalid]="campoInvalido('seq_cidade')"
          formControlName="seq_cidade"
        />

        @if (campoInvalido('seq_cidade')) {
          <p-message severity="error" size="small" variant="simple" text="Bairro de residência e obrigatorio." />
        }
      </div>

      <div class="field col-span-6">
        <label for="seq_vinculo">Vínculo</label>
        <p-select
          inputId="seq_vinculo"
          [options]="vinculos"
          optionLabel="ds_nome"
          optionValue="seq_vinculo"
          placeholder="Selecione"
          [invalid]="campoInvalido('seq_vinculo')"
          formControlName="seq_vinculo"
        />

        @if (campoInvalido('seq_vinculo')) {
          <p-message severity="error" size="small" variant="simple" text="Vinculo e obrigatorio." />
        }
      </div>

      <div class="field col-span-6">
        <label for="seq_ministerios">Ministérios/serviços</label>
        <p-multiselect
          inputId="seq_ministerios"
          [options]="ministerios"
          optionLabel="ds_nome"
          optionValue="seq_ministerio"
          display="chip"
          placeholder="Selecione os ministerios"
          formControlName="seq_ministerios"
        />
      </div>

      <div class="field col-span-6">
        <label for="seq_lider">Lider</label>
        <p-select
          inputId="seq_lider"
          [options]="lideres"
          optionLabel="ds_nome"
          optionValue="seq_pessoa"
          placeholder="Selecione"
          [filter]="true"
          [showClear]="true"
          formControlName="seq_lider"
        />
      </div>

      <div class="field col-span-12">
        <label for="observacoes">Observacoes</label>
        <textarea id="observacoes" pTextarea rows="5" formControlName="observacoes"></textarea>
      </div>

      <div class="actions-row col-span-12">
        <p-button [label]="modoDetalhe ? 'Voltar' : 'Cancelar'" icon="pi pi-times" severity="secondary" [outlined]="true" routerLink="/pessoas" />
        @if (!modoDetalhe) {
          <p-button type="submit" [label]="modoEdicao ? 'Atualizar' : 'Salvar'" icon="pi pi-check" />
        }
      </div>
    </form>
  </p-card>
</section>
