<section class="container-fluid pessoa-form-page">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-1">
        {{ modoEdicao ? 'Editar Pessoa' : 'Nova Pessoa' }}
      </h1>
      <p class="text-secondary mb-0">
        {{ modoEdicao ? 'Atualize os dados cadastrais.' : 'Informe os dados principais da pessoa.' }}
      </p>
    </div>

    <a class="btn btn-outline-light" routerLink="/pessoas">
      Voltar
    </a>
  </div>

  <div class="card app-card">
    <div class="card-body p-4">
      <form [formGroup]="form" (ngSubmit)="salvar()">
        <div class="row g-3">
          <div class="col-12 col-lg-6">
            <label class="form-label">Nome:</label>
            <input class="form-control app-input" formControlName="nome" />

            <small class="text-danger" *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched">
              Nome é obrigatório.
            </small>
          </div>

          <div class="col-12 col-lg-3">
            <label class="form-label">Telefone:</label>
            <input class="form-control app-input" formControlName="telefone" />
          </div>

          <div class="col-12 col-lg-3">
            <label class="form-label">Data de nascimento:</label>
            <input type="date" class="form-control app-input" formControlName="dataNascimento" />
          </div>

          <div class="col-12 col-lg-3">
            <label class="form-label">Sexo:</label>
            <select class="form-select app-input" formControlName="sexo">
              <option value="">Selecione...</option>
              <option value="M">Masculino</option>
              <option value="F">Feminino</option>
            </select>
          </div>

          <div class="col-12 col-lg-3">
            <label class="form-label">Filial:</label>
            <select class="form-select app-input" formControlName="filial">
              <option>Paranoá</option>
              <option>Brasília</option>
              <option>Luziânia</option>
            </select>
          </div>

          <div class="col-12 col-lg-6">
            <label class="form-label">Bairro de residência:</label>
             <select class="form-select app-input" formControlName="residencia">
              <option>Recanto das Emas</option>
              <option>Sobradinho</option>
              <option>Vicente Pires</option>
            </select>
          </div>

          <div class="col-12 col-lg-6">
            <label class="form-label">Vínculo:</label>
             <select class="form-select app-input" formControlName="residencia">
              <option>Apóstolo</option>
              <option>Bispo(a)</option>
              <option>Pastor(a)</option>
              <option>Evangelista</option>
              <option>Presbítero(a)</option>
              <option>Diácono(isa)</option>
              <option>Evangelista</option>
            </select>
          </div>

          <div class="col-12">
            <label class="form-label d-block">Ministérios/serviços:</label>

            <div class="d-flex gap-3 flex-wrap">
              <label class="form-check">
                <input class="form-check-input" type="checkbox" value="Kids" />
                <span class="form-check-label">Ministério infantil</span>
              </label>

              <label class="form-check">
                <input class="form-check-input" type="checkbox" value="Decoracao" />
                <span class="form-check-label">Decoração</span>
              </label>

              <label class="form-check">
                <input class="form-check-input" type="checkbox" value="Decoracao" />
                <span class="form-check-label">Louvor</span>
              </label>

              <label class="form-check">
                <input class="form-check-input" type="checkbox" value="Comunicacao" />
                <span class="form-check-label">Comunicação</span>
              </label>

              <label class="form-check">
                <input class="form-check-input" type="checkbox" value="Líder de célula" />
                <span class="form-check-label">Líder de célula</span>
              </label>

               <label class="form-check">
                <input class="form-check-input" type="checkbox" value="Líder de célula" />
                <span class="form-check-label">Adote</span>
              </label>
            </div>
          </div>

          <div class="col-12">
            <label class="form-label">Observações:</label>
            <textarea class="form-control app-input" rows="4" formControlName="observacoes"></textarea>
          </div>

          <div class="col-12 d-flex justify-content-end gap-2 mt-3">
            <a class="btn btn-outline-light px-4" routerLink="/pessoas">
              Cancelar
            </a>

            <button class="btn btn-primary px-4" type="submit">
              {{ modoEdicao ? 'Atualizar' : 'Salvar' }}
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
