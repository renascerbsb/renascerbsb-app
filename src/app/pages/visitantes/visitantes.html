<section class="container-fluid visitantes-page">
  <div class="page-header mb-4">
    <h1 class="h3 text-light mb-1">Cadastro Rápido de Visitantes</h1>
    <p class="text-secondary mb-0">Registro simples para visitantes do culto.</p>
  </div>

  <div class="card app-card text-light border-secondary visitor-card">
    <div class="card-body p-4">
      <form>
        <div class="row g-4">
          <div class="col-12 col-lg-5">
            <label class="form-label">Nome:</label>
            <input type="text" class="form-control app-input text-light border-secondary" />
          </div>

          <div class="col-12 col-md-6 col-lg-3">
            <label class="form-label">Filial:</label>
            <select class="form-select app-input text-light border-secondary">
              <option>Paranoá</option>
              <option>Asa Norte</option>
              <option>Ceilândia</option>
            </select>
          </div>

          <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label">Bairro de residência:</label>
            <select class="form-select app-input text-light border-secondary">
              <option>Gama</option>
              <option>Paranoá</option>
              <option>Taguatinga</option>
              <option>Samambaia</option>
            </select>
          </div>

          <div class="col-12 col-lg-5">
            <label class="form-label">Quem convidou?</label>
            <select class="form-select app-input text-light border-secondary">
              <option selected disabled>Selecione...</option>
              <option>João</option>
              <option>Maria</option>
            </select>
          </div>

          <div class="col-12 col-lg-7">
            <label class="form-label">Culto visitado:</label>
            <select class="form-select app-input text-light border-secondary">
              <option>Domingo - 10h</option>
              <option>Domingo - 19h</option>
              <option>Quarta - 20h</option>
            </select>
          </div>

          <div class="col-12 col-lg-5">
            <label class="form-label d-block">Aceita contato?</label>

            <div class="d-flex gap-4">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="aceitaContato" id="contatoSim" />
                <label class="form-check-label" for="contatoSim">Sim</label>
              </div>

              <div class="form-check">
                <input class="form-check-input" type="radio" name="aceitaContato" id="contatoNao" />
                <label class="form-check-label" for="contatoNao">Não</label>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-7">
            <label class="form-label">Telefone:</label>
            <input type="tel" class="form-control app-input text-light border-secondary" />
          </div>

          <div class="col-12">
            <label class="form-label">Outras observações:</label>
            <textarea class="form-control app-input text-light border-secondary" rows="6"></textarea>
          </div>

          <div class="col-12 d-flex justify-content-end">
            <button type="button" class="btn btn-primary px-5">
              Salvar
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</section>
